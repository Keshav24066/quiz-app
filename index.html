<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="quiz-container">
      <div id="quiz-box">
        <div class="quiz-header">
          <h1>Quiz Challenge</h1>
          <div class="timer-box">
            <span>Time</span>
            <strong id="timer">00:00</strong>
          </div>
        </div>

        <div class="progress-box">
          <span id="progress-text">Question 1/5</span>
        </div>

        <h2 id="question">Question text</h2>

        <div id="options" class="options"></div>

        <button id="next-btn" class="next-btn">Next</button>
      </div>

      <div id="result-box" class="hidden">
        <h2>Result Summary</h2>
        <div class="result-grid">
          <div class="result-item">
            <span>Total</span>
            <strong id="total-questions">0</strong>
          </div>
          <div class="result-item">
            <span>Correct</span>
            <strong id="correct-answers">0</strong>
          </div>
          <div class="result-item">
            <span>Wrong</span>
            <strong id="wrong-answers">0</strong>
          </div>
          <div class="result-item">
            <span>Percentage</span>
            <strong id="percentage">0%</strong>
          </div>
          <div class="result-item">
            <span>Time Taken</span>
            <strong id="time-taken">00:00</strong>
          </div>
        </div>

        <button id="restart-btn" class="restart-btn">Play Again</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
